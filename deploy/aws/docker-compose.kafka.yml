# Kafka-only stack for AWS lab (run on an EC2 in the same VPC as ECS).
# Before starting, set KAFKA_HOST to this EC2's *private* IPv4 (e.g. 172.31.12.34).
#
#   export KAFKA_HOST=$(hostname -I | awk '{print $1}')
#   docker compose -f docker-compose.kafka.yml up -d
#
# Then set ECS task env: KAFKA_BROKERS=${KAFKA_HOST}:9092

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: study-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: study-kafka-init
    network_mode: service:kafka
    depends_on:
      - kafka
    restart: on-failure
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "waiting for kafka..."
        until kafka-topics --bootstrap-server localhost:9092 --list; do
          sleep 2
        done
        kafka-topics --bootstrap-server localhost:9092 --create --if-not-exists \
          --topic product-events --partitions 1 --replication-factor 1
        kafka-topics --bootstrap-server localhost:9092 --list
